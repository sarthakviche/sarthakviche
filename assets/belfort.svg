<style>.l{font:600 11px 'SF Mono','JetBrains Mono',Consolas,monospace;letter-spacing:2px;fill:#ffd84a}.h{font:600 30px 'SF Pro Display','Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif;letter-spacing:-.6px;fill:#fff}.d{font:400 14px 'SF Pro Display','Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif;fill:#aab2c0}.t{font:500 11px 'SF Mono','JetBrains Mono',Consolas,monospace;fill:#ffd84a}.s{font:700 34px 'SF Pro Display','Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif;letter-spacing:-1px;fill:#fff;text-anchor:end}.c{font:400 11px 'SF Mono','JetBrains Mono',Consolas,monospace;fill:#7d8590;text-anchor:end}
