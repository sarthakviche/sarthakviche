<text x="32" y="118" class="d">A trading classroom for Indian markets: a short course, paper trading,</text><text x="32" y="139" class="d">a chart-replay trainer, and one clear research report per NSE stock.</text><text x="32" y="160" class="d">Free, MIT licensed, runs locally with no account.</text><rect x="32" y="214" width="62" height="24" rx="12" fill="#ffd84a" fill-opacity=".12" stroke="#ffd84a" stroke-opacity=".35"/><text x="63.0" y="230" text-anchor="middle" class="t">Python</text><rect x="102" y="214" width="69" height="24" rx="12" fill="#ffd84a" fill-opacity=".12" stroke="#ffd84a" stroke-opacity=".35"/><text x="136.5" y="230" text-anchor="middle" class="t">Desktop</text><rect x="179" y="214" width="41" height="24" rx="12" fill="#ffd84a" fill-opacity=".12" stroke="#ffd84a" stroke-opacity=".35"/><text x="199.5" y="230" text-anchor="middle" class="t">NSE</text></svg>